name: Student Academic Performance ML CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Get project code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: |
          python train_model.py

      - name: Check ML quality gate
        run: |
          python quality_gate.py
          
      - name: Test Flask prediction API
        run: |
          pytest -v test_app.py    

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-artifacts
          path: |
            student_academic_model.pkl
            metrics.json
            students.csv
          if-no-files-found: error
          retention-days: 7
