
name: Student Academic Performance ML CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: |
          python train_model.py

      - name: Check ML quality gate
        run: |
          python quality_gate.py

      - name: Test ML pipeline
        run: |
          python -m unittest test_ml_pipeline.py -v

      - name: Test Flask prediction API
        run: |
          pytest -v test_app.py

      # Practical-7: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t student-result-ml:${{ github.sha }} .

      # Start Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      # Check application health
      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs student-result-ml-container
          exit 1

      # Test actual Student Academic Performance prediction API
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "age":18,
              "gender":"Male",
              "ethnicity":"Group A",
              "parental_education":"Bachelor",
              "family_income":"Medium",
              "school_type":"Public",
              "school_region":"Urban",
              "study_hours_per_week":15,
              "attendance_rate":90,
              "extracurricular_activities":2,
              "sports_participation":1,
              "tutoring_sessions":3,
              "parental_involvement":"High",
              "internet_access":"Yes",
              "has_laptop":"Yes",
              "sleep_hours":7,
              "stress_level":4,
              "motivation_score":8,
              "reading_score":80,
              "writing_score":82,
              "math_score":85,
              "science_score":84
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"

          echo "$response" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          assert data["prediction"] in [0, 1], "Invalid prediction"
          assert data["result"] in ["PASS", "FAIL"], "Invalid result"
          print("Prediction API test passed.")
          '

      # Capture logs even if an earlier step fails
      - name: Show Docker container logs
        if: always()
        run: |
          docker logs student-result-ml-container || true

      # Always stop and remove the container
      - name: Stop and remove Docker container
        if: always()
        run: |
          docker rm -f student-result-ml-container || true

      # Prepare release package
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp student_academic_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp students.csv release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf '%s\n' \
            'Student Academic Performance Prediction API' \
            'Start with: python app.py' \
            'Prediction endpoint: POST /predict' \
            > release_candidate/DEPLOYMENT.txt

      # Upload release package
      - name: Upload ML release package
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      # Upload validated artifacts
      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-artifacts
          path: |
            student_academic_model.pkl
            metrics.json
            students.csv
          if-no-files-found: error
          retention-days: 7
